title: Let's Talk Science Now
tagline: Making science simple, visual and fascinating.
description: >-
  Short visual science stories with deeper articles, references,
  and pathways for continued exploration.
url: "https://letstalksciencenow.com"
baseurl: ""
lang: en

instagram_username: lets.talk.science.now
youtube_url: "https://www.youtube.com/@LetsTalkScienceNow"
github_url: "https://github.com/Akif-Vohra/LetsTalkScienceNow"

# Each story is a folder under _stories/ (a "page bundle"):
#   _stories/<id>/cover.png  — thumbnail (published at /stories/<id>/cover.png)
#   _stories/<id>/index.md   — the article (added later)
collections:
  stories:
    output: true

plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - README.md
  - CLAUDE.md
  - writing-voice.md
  - Gemfile
  - Gemfile.lock
  - design/
  - vendor/
  - .bundle/
  - maps/
  - assets/geo/*.zip      # archived source, kept in git but not published
  - assets/geo/*.tiff     # ditto — raw rasters/KML that derived geojson files were traced from
  - assets/geo/*.kml
  - assets/geo/gondwana.png
  - assets/geo/Rivers/
  - assets/geo/Reservoir/
