---
layout: default
title: Map
permalink: /map/
description: An interactive map of the geological features of the Indian subcontinent.
---

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<section class="section">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Explore</p>
      <h2>Geology of the subcontinent.</h2>
      <p>Tap a marker to jump to the story behind each feature. Switch between satellite and streets, top-right.</p>
    </div>
    <div id="map" style="height:min(72vh,640px);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);"></div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
  var pins = [
    {%- for pin in site.data.map -%}
      {%- assign r = site.data.reels | where: "id", pin.story | first -%}
    { title: {{ pin.title | jsonify }},
      latlng: [{{ pin.latlng[0] }}, {{ pin.latlng[1] }}],
      url: {{ pin.story | prepend: "/stories/" | append: "/" | relative_url | jsonify }},
      snippet: {{ r.summary | default: r.overlay_title | strip_newlines | truncatewords: 26 | jsonify }} },
    {%- endfor -%}
  ];

  // Base layers — free, no API key.
  var streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  });
  var satellite = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics', maxZoom: 19
    }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19  // transparent place labels on top of the imagery
    })
  ]);

  var map = L.map('map', { layers: [satellite] }).setView([21, 82], 4);   // default to satellite
  L.control.layers({ 'Satellite': satellite, 'Streets': streets }, null, { collapsed: false }).addTo(map);

  pins.forEach(function (p) {
    L.marker(p.latlng).addTo(map)
      .bindPopup('<strong>' + p.title + '</strong><br>' + p.snippet + '<br><a href="' + p.url + '">Read the story &rarr;</a>');
  });

  if (pins.length) map.fitBounds(pins.map(function (p) { return p.latlng; }), { padding: [40, 40] });
</script>
