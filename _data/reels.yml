  tags: [science, EyeFloaters, HumanBody, sciencefact]
  caption: |
    Ever noticed tiny squiggles drifting across your vision? 👁️

    They're called eye floaters — tiny clumps or fibers inside the gel-like fluid of your eye.

    You usually notice them more when looking at a bright sky, white wall, or screen because they cast tiny shadows on your retina. Google says that most floaters are harmless, but if you suddenly see lots of new floaters, flashes of light, or a dark curtain in your vision, you should get your eyes checked.

    I made this reel just to share my knowledge and explain the science in a simple way. For any questions or concerns related to eye health, always rely on a medically certified doctor.

    #science #EyeFloaters #HumanBody #sciencefact

