- id: western-ghats-madagascar
  date: 2026-07-29
  overlay_title: "Western Ghats of India were reconnected to Madagascar once! 🏔🏔🏔"
  reel_url:
  youtube_url: https://www.youtube.com/shorts/RT8jixSWCiM
  youtube_id: RT8jixSWCiM
  image: /stories/western-ghats-madagascar/cover.png
  topic: our-planet
  series: indian-geology
  location: "Western Ghats, India (and Central Highlands, Madagascar)"
  tags: [science, westernghat, geology, earthscience, india]
  references:
    - "Subrahmanya, K. R. — Evolution of the Western Ghats, India – A Simple Model"
    - "Storey et al. (1995), Timing of Hot Spot–Related Volcanism and the Breakup of Madagascar and India"
    - "Images from Wikipedia or edited by the author"
  summary: >-
    The Western Ghats of India and the central mountains of Madagascar were once part of the
    same landscape. The very event that split India and Madagascar apart, about 90 million
    years ago, is what raised both of them.
  body: |
    The Western Ghats of India and the central highlands of Madagascar show a strikingly similar geological profile. They have a similar length from north to south, similar elevation, and geological features that mirror each other on both sides. This is not a coincidence. They were once part of the same landscape, and the same process created both of them.

    Up until about 90 million years ago, India and Madagascar were still joined together and moving northeast as one landmass. As they passed over the Marion hotspot, this geological hotspot was pushing extremely hot material from deep inside the Earth towards the surface beneath them. (This hot material is mostly solid rock and not lava. The pressure deep inside the Earth is so high that it stays solid despite the high temperature, and it only starts to melt as it rises towards the upper layers where the pressure drops.)

    This intense heat caused the rocks above to expand and rise into a broad dome or bulge. Eventually, the constant heating and stretching weakened the crust so much that it finally broke apart. Geologists call this process rifting. The eastern side of this break became the Western Ghats of India, and the western side became the central mountains of Madagascar.
  key_terms:
    - term: Hotspot
      definition: "A fixed plume of unusually hot material rising from deep in the mantle. As tectonic plates drift over it, it can heat, dome, and crack the crust above."
    - term: Mantle
      definition: "The thick layer between Earth's crust and core. Despite being intensely hot, it is mostly solid rock, because the immense pressure keeps it from melting."
    - term: Crustal doming
      definition: "When heat from below makes the crust expand and bulge upward into a broad dome, like a blister on the surface."
    - term: Rifting
      definition: "The stretching, weakening, and eventual splitting of the crust. Here, it is the break that separated Madagascar from India."
  further_reading:
    - label: "Start here — plain language"
      items:
        - text: "K. R. Subrahmanya — “Evolution of the Western Ghats, India: A Simple Model”"
          note: "Beginner-friendly; the paper this reel is based on."
    - label: "Go deeper — academic"
      items:
        - text: "Storey et al. (1995) — Timing of Hot Spot–Related Volcanism and the Breakup of Madagascar and India"
    - label: "Background reading"
      items:
        - text: "Western Ghats (Wikipedia)"
          url: "https://en.wikipedia.org/wiki/Western_Ghats"
        - text: "Hotspot (geology) (Wikipedia)"
          url: "https://en.wikipedia.org/wiki/Hotspot_(geology)"
        - text: "Rift (Wikipedia)"
          url: "https://en.wikipedia.org/wiki/Rift"
    - label: "Image credits"
      items:
        - text: "Maps and imagery from Wikipedia, or edited by the author."
  transcript: |
    Western Ghats of India and central mountains of Madagascar fit together like a jigsaw puzzle. They have similar length north to south, similar elevation profile, and similar geological features on both sides.

    And the reason for this surprising geological similarity is that the process that created the Western Ghats of India is the same process that also broke apart Madagascar from the Indian subcontinent about 90 million years ago.

    Up until about 90 to 100 million years ago, Madagascar was joined together with the Indian subcontinent. They were both located south of the Marion island, moving northeast at a pace of about 10–15 cm per year — about to cross the place where Marion island is today over the next several million years.

    Marion island is a geological hotspot. A geological hotspot on the Earth's surface is a place where, due to exceptionally hot conditions in the deeper layer of the Earth, extremely hot rock (called mantle) is constantly trying to push up towards the surface.

    So when India and Madagascar were crossing the Marion hotspot, it was kind of like taking a plastic sheet and moving it over a candle slowly — what would happen? The plastic sheet would break apart. The exact same thing happened with India and Madagascar as they moved over this extremely hot mantle.

    The heat rose towards the surface where the Western Ghats are located today, and because it was extremely hot it heated up all the rocks below. That made them expand and start to create a dome or bulge, raising the terrain where the Western Ghats and central mountains of Madagascar are located.

    Eventually this constant bulging, doming and heating weakened the crust so much that it completely broke apart. This process is called rifting in geology. The eastern shoulder of this rift became the Western Ghats of India, and the western part became the central mountains of Madagascar — parts of the same geological landscape.
  caption: |
    Western Ghats of India and the Central Highlands of Madagascar show a strikingly similar geological profile. They have a similar north-to-south length of about 1,600 km, similar elevation profiles with extensive uplands around 1–1.5 km above sea level, and similar geological features which mirror each other. They are also home to remarkably similar Precambrian rocks, and even share matching tectonic structures such as the Palakkad Gap in India and the Ranotsara Shear Zone in Madagascar. Their highest peaks, Anamudi (2,695 m) and Maromokotro (2,876 m), are also comparable in elevation.

    The reason for this is that the process that created the Western Ghats is the same process that also broke Madagascar away from the Indian subcontinent about 90 million years ago.

    The process started when India and Madagascar were still joined together and moving northeast. As they passed over the Marion hotspot about 90 million years ago, this geological hotspot was pushing extremely hot mantle material towards the surface beneath them. This intense heat caused the overlying rocks to expand and create a broad dome or bulge in a process known as crustal doming. Eventually, the constant heating combined with the northeast movement of the Indian subcontinent weakened and stretched the continental crust. The increasing tectonic stress finally caused the continent to break apart, separating Madagascar from India.

    All images used are from Wikipedia or edited by me.

    For further reading, I can recommend "Evolution of the Western Ghats, India – A Simple Model" by K. R. Subrahmanya. #science #westernghat #geology #earthscience #india
  pinned_comment: |
    As always if you see any mistakes in my understanding or explanation please let me know. 🙏🏼

    Western Ghats were designated as a UNESCO World Heritage Site for their extremely important ecological significance and unique geological history.

    I have intentionally used some simplified phrasing. For example, the mantle in the deeper Earth is not really lava as a lot of people presume it to be. Instead, it is mostly solid rock because the pressure there is so high that, despite the high temperatures, it remains solid. Small parts can melt and become magma as they rise towards the upper layers where the pressure drops. Once magma reaches the Earth's surface, it is called lava.

    After the creation of the Western Ghats and Central Highlands of Madagascar they both continued to shape up due to erosion, weathering and further tectonic processes. In the Western Ghats, erosion created a narrow strip of flat land just west of the mountains where many of India's big cities such as Mumbai are located. Towards the east it created a gentle slope, which is why most rivers in southern India flow west to east.

    One more interesting thing is that both the Western Ghats and Madagascar have a matching low-elevation gap. In India it is known as the Palakkad Gap, while in Madagascar it is known as the Ranotsara Shear Zone. These were already zones of weakness before India and Madagascar broke apart, so they remained lower than the surrounding rocks during uplift.

    About 66 million years ago the northern half of the Western Ghats went through another massive geological event known as the Deccan Traps. This covered the northern half with basaltic lava, which is why the northern and southern parts of the Western Ghats have very different surface rock profiles. I will talk more about this event in my next videos.

    There are many studies on this subject, but a simple language reading which I really loved is "Evolution of the Western Ghats, India – A Simple Model" by K. R. Subrahmanya. One more recent study is Storey et al. (1995), Timing of Hot Spot–Related Volcanism and the Breakup of Madagascar and India.

