  image: /stories/nasal-cycle/cover.svg
  topic: nature
  tags: [science, funfact, humananatomy, biology]
  caption: |
    The nasal cycle is the completely normal, subconscious shifting of airflow between your nostrils. Controlled by the autonomic nervous system, blood vessels in your nasal passages periodically swell on one side while shrinking on the other. This automatic shift alternates every 2 to 6 hours. It should not be confused with pathological nasal issues where one or both nostrils are blocked by a medical problem like cold allergy, flu or something else. So always see a doctor if one side is always closed. #science #funfact #humananatomy #biology

