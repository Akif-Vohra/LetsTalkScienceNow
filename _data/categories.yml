# Category slug -> display name, card tint class (see main.css .tint-*), and summary
geology:
  name: Geology
  tint: tint-planet
  summary: "Deep time, landforms, plate tectonics, and the forces that shape the Earth."
biology:
  name: Biology
  tint: tint-nature
  summary: "Animals, plants, the human body, and the living systems all around us."
