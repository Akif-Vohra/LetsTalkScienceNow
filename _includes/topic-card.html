{%- assign t = site.data.topics[include.slug] -%}
{%- assign count = site.data.reels | where: "topic", include.slug | size -%}
<a class="topic-card {{ t.tint }}" href="{{ include.slug | prepend: '/topics/' | append: '/' | relative_url }}">
  <span class="dot"></span>
  <h3>{{ t.name }}</h3>
  {% if t.summary %}<p>{{ t.summary }}</p>{% endif %}
  <span class="go">{{ count }} stor{% if count == 1 %}y{% else %}ies{% endif %} &rarr;</span>
</a>
